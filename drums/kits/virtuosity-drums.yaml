# Virtuosity Drums by Versilian Studios and Karoryfer Lecords (CC0), as a core16
# kit. Built by tools/sfzkit.py from the kit's own SFZ program; see
# ../README.md.
#
# Played the way it loads: kick and snare close mics with the overheads, the
# mid, room and vintage mics off, every tuning control centred. `cc:` changes
# one for the whole kit, a role's `cc:` for that pad only.

name: virtuosity-drums
title: Virtuosity Drums
description: Jazz kit recorded in Boston, up to 36 velocity layers
creator: Versilian Studios, Karoryfer Lecords
licence: CC0-1.0
source: sfz
content_root: ~/Samples/SFZ/Virtuosity Drums
program: Programs/02-full-kit.sfz

# For the Drum Machine preset (tools/drumkit.py), set up the way Bitwig's
# own acoustic kits are (Acoustic Drums Kit Yamaha): 12 voices a pad, so a
# re-hit rings over the last one, and only the hi-hat chokes: any closed hat
# (pedal and shank too, which are its articulations) cuts the open one, never
# the other way round.
voices: 12
chokes:
  - {from: [hat-closed], to: [hat-open]}

roles:
  # Where a drum is on several pads (both banks double the kick, snare and
  # closed hat), the pads take the main articulation and `alt` in turn, so
  # the two in one bank sound different. The kit's only other closed hat is
  # the pedal.
  kick: {key: 36, alt: {key: 35, name: snares off, short: so}}
  snare: {key: 38, alt: {key: 39, name: off-centre, short: oc}}
  snare-rimshot: {key: 40}
  # The cross-stick: Virtuosity's 37 is a stick shot, not a sidestick.
  snare-sidestick: {key: 88}
  hat-closed: {key: 42, alt: {key: 44, name: pedal, short: p}}
  hat-open: {key: 46}
  # The kit has two toms. The other two are the same drums tuned three
  # semitones down with the kit's own tom tuning (±1200 cents over the CC,
  # centre 63.5), so the pads still step down in pitch from rack to floor.
  tom-rack-1: {key: 48}
  tom-rack-2: {key: 48, cc: {86: 47.6}}
  tom-floor-1: {key: 41}
  tom-floor-2: {key: 41, cc: {81: 47.6}}
  crash-1: {key: 49}
  # The flat ride played as a crash: the kit's only second crash sound.
  crash-2: {key: 55}
  ride-bow: {key: 51}
  ride-bell: {key: 53}
  # Bank B only (core16-bank-b). The kit has no china; the flat ride played
  # as a crash stands in, the same sound as crash-2.
  china: {key: 55}
