# SM Drums ("Deeply Sampled Free Drums", sfzinstruments/SMDrums), as a core16
# kit. Built by tools/sfzkit.py from the kit's own SFZ program; see
# ../README.md. Public domain, by Scott McLean, Tod Stillwell and Suleiman
# Ali (sfzinstruments.github.io/drums/sm_drums); the repository itself
# carries no licence file.

name: sm-drums
title: SM Drums
description: Deeply sampled kit, up to 49 velocity layers, four crashes, two rides
creator: Scott McLean, Tod Stillwell, Suleiman Ali
licence: public domain
source: sfz
content_root: ~/Samples/SFZ/SM Drums
program: Programs/SM_Drums_kit.sfz

# For the Drum Machine preset (tools/drumkit.py), set up the way Bitwig's
# own acoustic kits are (Acoustic Drums Kit Yamaha): 12 voices a pad, so a
# re-hit rings over the last one, and only the hi-hat chokes: any closed hat
# cuts the open one, never the other way round.
voices: 12
chokes:
  - {from: [hat-closed], to: [hat-open]}

roles:
  # Where a drum is on several pads (both banks double the kick, snare and
  # closed hat), the pads take the main articulation and `alt` in turn, else
  # its takes are dealt out between them.
  kick: {key: 36}
  snare: {key: 38, alt: {key: 40, name: hybrid 2, short: h2}}
  snare-rimshot: {key: 39}
  snare-sidestick: {key: 37}
  hat-closed: {key: 42, alt: {key: 50, name: foot, short: f}}
  hat-open: {key: 46}
  tom-rack-1: {key: 48}
  tom-rack-2: {key: 47}
  tom-floor-1: {key: 45}
  tom-floor-2: {key: 43}
  # The 15" and 17" crashes, the 20" ride.
  crash-1: {key: 55}
  crash-2: {key: 57}
  ride-bow: {key: 62}
  ride-bell: {key: 63}
  # Bank B only (core16-bank-b).
  china: {key: 58}
