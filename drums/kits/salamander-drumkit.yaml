# The Salamander Drumkit by Alexander Holm / RytmenPinne! (CC-BY-SA-3.0:
# credit the author; the share-alike applies to sample libraries made from
# it, so the built kits stay on the box), as a core16 kit. Built by
# tools/sfzkit.py from ALL.sfz; see ../README.md.
#
# One stereo overhead pair, few velocity layers and many takes per layer,
# picked at random by the program and taken in turn here.

name: salamander-drumkit
title: Salamander Drumkit
description: Home-built birch kit, overheads only, up to 20 takes per layer
creator: Alexander Holm (RytmenPinne!)
licence: CC-BY-SA-3.0
source: sfz
content_root: ~/Samples/SFZ/Salamander Drumkit
program: ALL.sfz

# For the Drum Machine preset (tools/drumkit.py), set up the way Bitwig's
# own acoustic kits are (Acoustic Drums Kit Yamaha): 12 voices a pad, so a
# re-hit rings over the last one, and only the hi-hat chokes: any closed hat
# cuts the open one, never the other way round.
voices: 12
chokes:
  - {from: [hat-closed], to: [hat-open]}

roles:
  # Where a drum is on several pads (both banks double the kick, snare and
  # closed hat), the pads take the main articulation and `alt` in turn, so
  # the two in one bank sound different: the kit has two kicks and two
  # snares.
  kick: {key: 36, alt: {key: 35, name: kick 1, short: "1"}}
  snare: {key: 38, alt: {key: 40, name: snare 1, short: "1"}}
  # No rimshot: Frankensnare's 14x8" aluminium snare plays one.
  snare-rimshot: {key: 38, from: frankensnare-14x8al-rims}
  snare-sidestick: {key: 41}
  hat-closed: {key: 42, alt: {key: 44, name: foot, short: f}}
  hat-open: {key: 46}
  # Two toms, 12" and 14", and no tuning control. The other two are the same
  # drums three semitones down, so the pads still step down from rack to
  # floor.
  tom-rack-1: {key: 45}
  tom-rack-2: {key: 45, tune: -300}
  tom-floor-1: {key: 43}
  tom-floor-2: {key: 43, tune: -300}
  crash-1: {key: 55}
  crash-2: {key: 57}
  ride-bow: {key: 52}
  ride-bell: {key: 53}
  # Bank B only (core16-bank-b): the Masterworks 20".
  china: {key: 59}
