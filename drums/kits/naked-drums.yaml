# Naked Drums by Wilkinson Audio (CC-BY-4.0: credit Wilkinson Audio), as a
# core16 kit. Built by tools/sfzkit.py from the kit's own SFZ program; see
# ../README.md.
#
# Played the way it loads: the stereo program with every mic (direct,
# overheads, close and far rooms, mid-side) at its default level, and the
# hi-hat in its default, note-per-articulation mode (keyswitch 12).

name: naked-drums
title: Naked Drums
description: Yamaha Recording Custom kit, two snares, five toms, 10 round robins
creator: Wilkinson Audio
licence: CC-BY-4.0
source: sfz
content_root: ~/Samples/SFZ/Naked Drums
program: Wilkinson Audio/Naked Drums/Stereo/Naked Drums.sfz

# For the Drum Machine preset (tools/drumkit.py), set up the way Bitwig's
# own acoustic kits are (Acoustic Drums Kit Yamaha): 12 voices a pad, so a
# re-hit rings over the last one, and only the hi-hat chokes: any closed hat
# cuts the open one, never the other way round.
voices: 12
chokes:
  - {from: [hat-closed], to: [hat-open]}

roles:
  # Where a drum is on several pads (both banks double the kick, snare and
  # closed hat), the pads take the main articulation and `alt` in turn, else
  # its ten round-robin takes are dealt out between them.
  kick: {key: 36}
  # The Ayotte 14" on 38, the Pearl 13" on 40 taking turns with it. The kit
  # has no rimshot: Frankensnare's 14x8" aluminium snare plays one.
  snare: {key: 38, alt: {key: 40, name: Pearl, short: P}}
  snare-rimshot: {key: 38, from: frankensnare-14x8al-rims}
  snare-sidestick: {key: 37}
  hat-closed: {key: 42, alt: {key: 39, name: tight, short: t}}
  hat-open: {key: 49}
  # Five toms; the four used step down 12", 13", 14", 16". The 10" (48) is
  # left out.
  tom-rack-1: {key: 47}
  tom-rack-2: {key: 45}
  tom-floor-1: {key: 43}
  tom-floor-2: {key: 41}
  crash-1: {key: 55}
  crash-2: {key: 57}
  ride-bow: {key: 51}
  ride-bell: {key: 53}
  # Bank B only (core16-bank-b).
  china: {key: 50}

# Names for `sfzkit.py full`, from the program's keymap (Data/keymap.txt);
# its sample files are named by mic and a hash.
names:
  44: Hi-hat Pedal
  46: Hi-hat Half Open
  48: Tom 1
  52: China 2
  54: Splash 1
  56: Splash 2
  58: Crash 1 Bell
  59: Crash 2 Bell
