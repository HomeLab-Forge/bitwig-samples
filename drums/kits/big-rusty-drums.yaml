# Big Rusty Drums by Karoryfer Samples (CC0), as a core16 kit. Built by
# tools/sfzkit.py from the kit's own SFZ program; see ../README.md.
#
# The program is played the way it loads: every CC at its set_cc value, so the
# mic balance, pans and tuning are the ones Karoryfer ships. `cc:` changes one
# for the whole kit, a role's `cc:` for that pad only.

name: big-rusty-drums
title: Big Rusty Drums
description: Oversized 1980s Polish kit, close, overhead and room mics
creator: Karoryfer Samples
licence: CC0-1.0
source: sfz
content_root: ~/Samples/SFZ/Big Rusty Drums
program: Programs/01-full.sfz

# For the Drum Machine preset (tools/drumkit.py), set up the way Bitwig's
# own acoustic kits are (Acoustic Drums Kit Yamaha): 12 voices a pad, so a
# re-hit rings over the last one, and only the hi-hat chokes: any closed hat
# (pedal and shank too, which are its articulations) cuts the open one, never
# the other way round.
voices: 12
chokes:
  - {from: [hat-closed], to: [hat-open]}

roles:
  # Where a drum is on several pads (both banks double the kick, snare and
  # closed hat), the pads take the main articulation and `alt` in turn, so
  # the two in one bank sound different.
  kick: {key: 36, alt: {key: 35, name: undamped, short: op}}
  snare: {key: 38, alt: {key: 39, name: edge, short: ed}}
  snare-rimshot: {key: 40}
  snare-sidestick: {key: 37}
  hat-closed: {key: 42, alt: {key: 54, name: shank, short: sh}}
  hat-open: {key: 46}
  tom-rack-1: {key: 47}
  tom-rack-2: {key: 45}
  tom-floor-1: {key: 43}
  tom-floor-2: {key: 41}
  crash-1: {key: 49}
  crash-2: {key: 65}
  ride-bow: {key: 51}
  ride-bell: {key: 53}
  # Bank B only (core16-bank-b): the 18" china.
  china: {key: 57}
