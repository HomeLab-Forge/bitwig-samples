# MuldjordKit by Lars Muldjord / DrumGizmo (CC-BY-4.0: credit Lars Muldjord),
# as a core16 kit, from the sfzinstruments SFZ port by kinwie. Built by
# tools/sfzkit.py; see ../README.md.

name: muldjord-kit
title: Muldjord Kit
description: Two kicks, four toms, two rides and a china, DrumGizmo recording
creator: Lars Muldjord, DrumGizmo
licence: CC-BY-4.0
source: sfz
content_root: ~/Samples/SFZ/Muldjord Kit
program: DrumGizmo/MuldjordKit/Stereo/DrumGizmo MuldjordKit.sfz

# For the Drum Machine preset (tools/drumkit.py), set up the way Bitwig's
# own acoustic kits are (Acoustic Drums Kit Yamaha): 12 voices a pad, so a
# re-hit rings over the last one, and only the hi-hat chokes: any closed hat
# cuts the open one, never the other way round.
voices: 12
chokes:
  - {from: [hat-closed], to: [hat-open]}

roles:
  # Where a drum is on several pads (both banks double the kick, snare and
  # closed hat), the pads take the main articulation and `alt` in turn, else
  # its takes are dealt out between them. The kit has two kicks.
  kick: {key: 36, alt: {key: 35, name: left kick, short: L}}
  snare: {key: 38}
  # No rimshot in the kit: Frankensnare's 14x8" aluminium snare plays one.
  snare-rimshot: {key: 38, from: frankensnare-14x8al-rims}
  # "Rest": the stick laid on the head, the cross-stick.
  snare-sidestick: {key: 37}
  hat-closed: {key: 42}
  hat-open: {key: 46}
  tom-rack-1: {key: 48}
  tom-rack-2: {key: 47}
  tom-floor-1: {key: 45}
  tom-floor-2: {key: 41}
  crash-1: {key: 49}
  crash-2: {key: 57}
  ride-bow: {key: 51}
  ride-bell: {key: 53}
  # Bank B only (core16-bank-b).
  china: {key: 52}
